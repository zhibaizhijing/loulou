<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lou Lou — Color: Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fafafe; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sw { border-radius: 12px; padding: 14px; height: 132px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-size: 13px; font-weight: 600; }
  .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
  .role { font-size: 10.5px; opacity: 0.65; line-height: 1.3; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--ll-bg); border: 1px solid var(--ll-border);">
      <div><div class="name">Page bg</div><div class="role">Behind all screens</div></div>
      <div class="hex">#F8F8FC</div>
    </div>
    <div class="sw" style="background: var(--ll-surface); box-shadow: var(--ll-shadow-card);">
      <div><div class="name">Surface</div><div class="role">Cards, sheets</div></div>
      <div class="hex">#FFFFFF</div>
    </div>
    <div class="sw" style="background: #fff; border: 1px solid var(--ll-border);">
      <div><div class="name">Border</div><div class="role">Hairline, 1 px</div></div>
      <div class="hex">#EEEEF2</div>
    </div>
  </div>
</body>
</html>
