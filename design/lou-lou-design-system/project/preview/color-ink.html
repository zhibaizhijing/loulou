<!doctype html>
<!-- @dsCard group="Brand" name="Colors · Ink (Primary)" subtitle="Default · Press · Disabled CTA states" viewport="700x188" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lou Lou — Color: Brand Anchor</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; }
  .row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; }
  .sw { border-radius: 12px; padding: 16px; height: 132px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--ll-shadow-card); }
  .name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .hex  { font-family: var(--font-mono); font-size: 12px; opacity: 0.7; }
  .role { font-size: 11px; opacity: 0.65; line-height: 1.3; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--ll-ink); color: white;">
      <div>
        <div class="name">Ink — Primary</div>
        <div class="role">CTAs, primary text, dark pills</div>
      </div>
      <div class="hex">#22282C</div>
    </div>
    <div class="sw" style="background: var(--ll-ink-press); color: white;">
      <div>
        <div class="name">Ink Press</div>
        <div class="role">−10 % L on tap</div>
      </div>
      <div class="hex">#1A1F23</div>
    </div>
    <div class="sw" style="background: var(--ll-ink-disabled); color: white;">
      <div>
        <div class="name">Ink Disabled</div>
        <div class="role">50 % alpha</div>
      </div>
      <div class="hex">rgba(34,40,44,.5)</div>
    </div>
  </div>
</body>
</html>
