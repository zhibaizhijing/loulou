<!doctype html>
<!-- @dsCard group="Brand" name="Chips & Attribute Tags" subtitle="Category pill chips + pastel attribute blocks" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lou Lou — Chips & Category Tabs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; }
  .section { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; height: 32px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ll-text); background: #fff; border: 1px solid var(--ll-border); }
  .chip.active { background: var(--ll-ink); color: #fff; border-color: var(--ll-ink); font-weight: 600; }
  .tag { display: inline-flex; flex-direction: column; align-items: center; padding: 8px 14px; border-radius: 8px; gap: 2px; }
  .tag .k { font-size: 12px; font-weight: 600; color: var(--ll-text); }
  .tag .v { font-size: 11px; color: var(--ll-text-2); }
  .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ll-text-3); }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Category Chips (pill)</div>
    <div class="row">
      <div class="chip active">All</div>
      <div class="chip">Dog</div>
      <div class="chip">Cat</div>
      <div class="chip">Birds</div>
      <div class="chip">Fish</div>
    </div>
    <div class="label" style="margin-top: 8px;">Attribute Tags (pastel block)</div>
    <div class="row">
      <div class="tag" style="background: var(--ll-butter);"><div class="k">Pet Type</div><div class="v">Cat</div></div>
      <div class="tag" style="background: #E6F1EC;"><div class="k">Coat</div><div class="v">Short</div></div>
      <div class="tag" style="background: var(--ll-lavender);"><div class="k">Time</div><div class="v">30–45 mins</div></div>
    </div>
  </div>
</body>
</html>
