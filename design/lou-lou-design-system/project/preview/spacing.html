<!doctype html>
<!-- @dsCard group="Brand" name="Spacing Scale" subtitle="4 → 48 px, 16 is the workhorse" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lou Lou — Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; }
  .row { display: flex; align-items: flex-end; gap: 16px; height: 130px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--ll-ink); width: 100%; min-width: 36px; border-radius: 4px; }
  .num { font-family: var(--font-mono); font-size: 11px; color: var(--ll-text); font-weight: 600; }
  .lbl { font-size: 10.5px; color: var(--ll-text-2); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height: 4px;"></div><div class="num">4</div><div class="lbl">space-1</div></div>
    <div class="item"><div class="bar" style="height: 8px;"></div><div class="num">8</div><div class="lbl">space-2</div></div>
    <div class="item"><div class="bar" style="height: 12px;"></div><div class="num">12</div><div class="lbl">space-3</div></div>
    <div class="item"><div class="bar" style="height: 16px;"></div><div class="num">16</div><div class="lbl">space-4</div></div>
    <div class="item"><div class="bar" style="height: 20px;"></div><div class="num">20</div><div class="lbl">space-5</div></div>
    <div class="item"><div class="bar" style="height: 24px;"></div><div class="num">24</div><div class="lbl">space-6</div></div>
    <div class="item"><div class="bar" style="height: 32px;"></div><div class="num">32</div><div class="lbl">space-8</div></div>
    <div class="item"><div class="bar" style="height: 40px;"></div><div class="num">40</div><div class="lbl">space-10</div></div>
    <div class="item"><div class="bar" style="height: 48px;"></div><div class="num">48</div><div class="lbl">space-12</div></div>
  </div>
</body>
</html>
