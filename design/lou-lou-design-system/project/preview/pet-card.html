<!doctype html>
<!-- @dsCard group="Brand" name="Pet Stage Card" subtitle="Signature pastel-stage card with offset photo" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lou Lou — Pet Stage Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ll-bg); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stage { position: relative; border-radius: 16px; padding: 14px 16px 16px; height: 168px; box-sizing: border-box; overflow: hidden; }
  .stage.butter { background: var(--ll-butter); }
  .stage.lav { background: var(--ll-lavender); }
  .chart-dot { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; }
  .chart-dot svg { width: 16px; height: 16px; color: rgba(0,0,0,0.6); }
  .arrow { position: absolute; right: 14px; bottom: 14px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center; }
  .arrow svg { width: 14px; height: 14px; color: var(--ll-text); }
  .title { position: absolute; left: 16px; bottom: 38px; font-weight: 700; font-size: 15px; color: var(--ll-text); }
  .sub { position: absolute; left: 16px; bottom: 18px; font-size: 11.5px; color: rgba(30,30,36,0.65); }
  .face { position: absolute; right: -14px; top: 6px; width: 130px; height: 130px; background: rgba(0,0,0,0.06); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 56px; }
</style>
</head>
<body>
  <div class="row">
    <div class="stage butter">
      <div class="chart-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10m6 10V4m6 16v-7"/></svg></div>
      <div class="face">🐶</div>
      <div class="title">Premium Grooming</div>
      <div class="sub">Expert styling & hygiene care</div>
      <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg></div>
    </div>
    <div class="stage lav">
      <div class="chart-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10m6 10V4m6 16v-7"/></svg></div>
      <div class="face">🐱</div>
      <div class="title">Daily Walks</div>
      <div class="sub">Tracked routes & milestones</div>
      <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg></div>
    </div>
  </div>
</body>
</html>
