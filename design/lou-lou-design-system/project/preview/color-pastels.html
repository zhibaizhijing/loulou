<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lou Lou — Color: Pastels</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: 12px; padding: 14px; height: 132px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; color: var(--ll-text); }
  .name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.75; }
  .role { font-size: 10.5px; opacity: 0.65; line-height: 1.3; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--ll-butter);">
      <div><div class="name">Butter</div><div class="role">Tags, stat tiles</div></div>
      <div class="hex">#FEE7A6</div>
    </div>
    <div class="sw" style="background: var(--ll-lavender);">
      <div><div class="name">Lavender</div><div class="role">Pet card bg, tags</div></div>
      <div class="hex">#D8CAE8</div>
    </div>
    <div class="sw" style="background: var(--ll-mint);">
      <div><div class="name">Mint</div><div class="role">Optional / category</div></div>
      <div class="hex">#C7E8D8</div>
    </div>
    <div class="sw" style="background: var(--ll-peach);">
      <div><div class="name">Peach</div><div class="role">Optional / category</div></div>
      <div class="hex">#FBD3C4</div>
    </div>
  </div>
</body>
</html>
