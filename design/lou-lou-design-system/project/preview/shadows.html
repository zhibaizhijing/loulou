<!doctype html>
<!-- @dsCard group="Brand" name="Shadow & Elevation" subtitle="Card · Popover · Sheet" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lou Lou — Shadow & Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px 28px; background: var(--ll-bg); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card { background: #fff; border-radius: 12px; height: 110px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-size: 12.5px; font-weight: 600; }
  .sub  { font-family: var(--font-mono); font-size: 10.5px; color: var(--ll-text-2); line-height: 1.4; }
  .e1 { box-shadow: var(--ll-shadow-card); }
  .e2 { box-shadow: var(--ll-shadow-pop); }
  .e3 { box-shadow: var(--ll-shadow-lift); }
</style>
</head>
<body>
  <div class="row">
    <div class="card e1"><div class="name">E1 · Card</div><div class="sub">0 2 8 rgba(0,0,0,.04)</div></div>
    <div class="card e2"><div class="name">E2 · Popover</div><div class="sub">0 4 12 rgba(0,0,0,.08)</div></div>
    <div class="card e3"><div class="name">E3 · Sheet</div><div class="sub">0 8 24 rgba(0,0,0,.10)</div></div>
  </div>
</body>
</html>
